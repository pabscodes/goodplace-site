<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goodplace</title>
  <meta name="description" content="Goodplace helps new-home builders keep every buyer they meet.">
  <meta property="og:title" content="Goodplace">
  <meta property="og:description" content="Goodplace helps new-home builders keep every buyer they meet.">
  <meta name="theme-color" content="#1f4a3a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/Bitter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Bitter"; src: url("fonts/Bitter-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Variable.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }

    :root {
      --white: #ffffff;
      --cream: #f6f2ea;
      --evergreen: #1f4a3a;
      --pollen: #fbad05;
      --petal: #e13655;
      --ink: #1c2420;
      --ink-muted: #5d6662;
      --line: #e2dfd7;
      --serif: "Bitter", Georgia, serif;
      --sans: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
      --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-4: 48px; --space-5: 96px;
      --radius-card: 16px; --radius-pill: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--white);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 26px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 var(--space-4); }

    header { padding-top: var(--space-4); }
    .lockup { display: block; height: 32px; width: auto; }

    main { flex: 1; display: flex; align-items: center; padding: var(--space-5) 0; }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
      align-items: center;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 64px;
      line-height: 68px;
      letter-spacing: -0.02em;
      color: var(--evergreen);
      max-width: 11ch;
    }
    .lede {
      margin-top: var(--space-3);
      font-size: 18px;
      line-height: 28px;
      color: var(--ink-muted);
      max-width: 40ch;
      text-wrap: pretty;
    }
    .actions { margin-top: var(--space-4); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 44px; padding: 0 var(--space-3);
      border-radius: var(--radius-pill);
      font-family: var(--sans); font-size: 15px; line-height: 20px; font-weight: 500;
      text-decoration: none; white-space: nowrap;
      transition: background-color 150ms ease;
    }
    .btn:focus-visible { outline: 2px solid var(--evergreen); outline-offset: 2px; }
    .primary { background: var(--evergreen); color: var(--white); }
    .primary:hover { background: #173a2d; }
    .note { font-size: 14px; line-height: 20px; color: var(--ink-muted); display: inline-flex; align-items: center; gap: var(--space-1); }
    .note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pollen); }

    .art { width: 100%; aspect-ratio: 480 / 400; }
    .art svg { display: block; width: 100%; height: 100%; }

    footer { padding-bottom: var(--space-4); }
    .foot {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2);
      padding-top: var(--space-3);
      border-top: 1px solid var(--line);
      font-size: 14px; line-height: 20px; color: var(--ink-muted);
    }
    .foot a { color: var(--ink-muted); text-decoration: none; }
    .foot a:hover { color: var(--evergreen); }

    @media (max-width: 820px) {
      .wrap { padding: 0 var(--space-3); }
      header { padding-top: var(--space-3); }
      .lockup { height: 26px; }
      main { padding: var(--space-4) 0 var(--space-5); }
      .hero { grid-template-columns: 1fr; gap: var(--space-4); }
      h1 { font-size: 40px; line-height: 46px; letter-spacing: -0.015em; }
      .lede { font-size: 16px; line-height: 26px; }
      .actions { margin-top: var(--space-3); }
      .art { max-width: 420px; }
    }
    @media (max-width: 400px) {
      .wrap { padding: 0 var(--space-2); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="/" aria-label="Goodplace home"><img class="lockup" src="assets/goodplace-lockup.svg" alt="Goodplace"></a>
    </div>
  </header>

  <main>
    <div class="wrap hero">
      <div>
        <h1>Keep every buyer you meet.</h1>
        <p class="lede">Goodplace stays with home buyers through the months it takes to get ready, so new-home builders never lose the ones who weren't ready yet.</p>
        <div class="actions">
          <a class="btn primary" href="mailto:hello@getgoodplace.com">Get in touch</a>
          <span class="note">Building now</span>
        </div>
      </div>

      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 480 400" preserveAspectRatio="xMidYMid meet">
          <rect x="24" y="152" width="176" height="232" rx="16" fill="#f6f2ea"/>
          <rect x="48" y="72" width="48" height="48" rx="24" fill="#e13655"/>
          <rect x="112" y="16" width="368" height="368" rx="16" fill="#1f4a3a"/>
          <path d="M136 384V256a24 24 0 0 1 48 0V384Z" fill="#ffffff"/>
          <path d="M200 384V208a24 24 0 0 1 48 0V384Z" fill="#ffffff"/>
          <path d="M264 384V160a24 24 0 0 1 48 0V384Z" fill="#fbad05"/>
          <path d="M328 384V232a24 24 0 0 1 48 0V384Z" fill="#ffffff"/>
          <path d="M392 384V280a24 24 0 0 1 48 0V384Z" fill="#ffffff"/>
        </svg>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap"><div class="foot">
      <span>&copy; 2026 Goodplace</span>
      <a href="mailto:hello@getgoodplace.com">hello@getgoodplace.com</a>
    </div></div>
  </footer>
</body>
</html>
